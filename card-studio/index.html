<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#765687"><title>偶像卡片交換工作室</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body>
<header><div><span class="eyebrow">AIPRI CARD STUDIO · 非官方工具</span><h1>你的收藏，你的分享表。</h1><p>勾選可賣卡片、填數量與單價，做成社團販售表。</p></div><div class="badge">✦ 本機保存 · 可離線使用</div></header>
<nav class="studio-modes" aria-label="工作模式"><button id="sale-tab" aria-pressed="true">販售表</button><button id="exchange-tab" aria-pressed="false">交換表</button><button id="view-sheet" type="button">查看販售表 ↓</button></nav><main><section class="toolbar"><div class="stats"><strong id="total">載入圖庫中</strong><span id="counts"></span></div><div class="tools"><button id="update">檢查圖庫更新</button><button id="backup">備份我的清單</button><label class="button">還原清單<input id="restore" type="file" accept=".json" hidden></label></div></section><div id="status" role="status" aria-live="polite"></div><div class="layout"><details class="category-panel" open><summary>分類與篩選</summary><div id="category-buttons"></div></details><section class="panel library"><div class="heading"><h2>01 <span>卡片圖鑑</span></h2><label class="button subtle">＋ 自訂卡片<input id="images" type="file" accept="image/*" multiple hidden></label></div><div class="filters"><input id="search" type="search" placeholder="搜尋卡號、角色、造型…" aria-label="搜尋卡片"><select id="set" aria-label="彈數"><option value="">所有彈數</option></select><select id="rarity" aria-label="稀有度"><option value="">所有星等</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option></select><select id="filter" aria-label="清單"><option value="all">所有卡片</option><option value="have">讓 · 可讓出</option><option value="want">求 · 想徵求</option><option value="selected">交換已選取</option><option value="sale">可賣 · 已勾選</option></select><select id="character" aria-label="角色"><option value="">所有角色</option></select><select id="sort" aria-label="排序"><option value="catalog">圖鑑順序</option><option value="price-asc">單價由低到高</option><option value="price-desc">單價由高到低</option><option value="code">卡號順序</option></select></div><p class="hint">點卡圖看背面 · 點「讓／求」加入清單</p><div id="cards" class="grid"></div><div id="empty" class="empty" hidden>沒有符合條件的卡片</div><button id="more" class="more">顯示更多卡片</button></section><aside class="panel maker" id="workbench"><h2>02 <span id="workbench-label">販售表工作台</span></h2><label class="field">表圖標題<input id="title" value="我的卡片交換表" maxlength="40"></label><div class="pair"><label class="field">輸出內容<select id="mode"><option value="sale">販售表</option><option value="exchange">讓＋求 雙邊</option><option value="have">僅「讓」</option><option value="want">僅「求」</option></select></label><label class="field">每排張數<select id="columns"><option value="3">一排 3 張</option><option value="5">一排 5 張</option></select></label></div><p id="sale-summary" class="hint"></p><div class="preview-wrap"><canvas id="preview" aria-label="交換表預覽"></canvas></div><button id="download" class="primary full">↓ 下載 PNG 表圖</button><p id="maker-hint" class="hint">販售表只匯出已勾選卡片，金額為每張單價（NT$）。未填單價會標示「單價未填」。清單與備註只保存在此瀏覽器，不會上傳。</p><div class="version" id="version"></div></aside></div></main><footer>非官方收藏整理工具 · 卡片圖片與角色版權歸原權利人所有 · <a href="https://aipri.com.tw/cards/6" target="_blank" rel="noopener">官方卡片資訊 ↗</a><br>清除瀏覽器資料前，請先備份清單。</footer><script src="data/catalog.js"></script><script src="app.js"></script></body></html>
