<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#765687"><title>偶像卡片交換工作室</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"></head><body>
<header><div><span class="eyebrow">AIPRI CARD STUDIO · 非官方工具</span><h1>你的收藏，你的交換表。</h1><p>翻看卡片正反面，整理「讓」與「求」，把心願帶走。</p></div><div class="badge">✦ 本機保存 · 可離線使用</div></header>
<main><section class="toolbar"><div class="stats"><strong id="total">載入圖庫中</strong><span id="counts"></span></div><div class="tools"><button id="offline">下載離線圖庫</button><button id="update">檢查圖庫更新</button><button id="backup">備份我的清單</button><label class="button">還原清單<input id="restore" type="file" accept=".json" hidden></label></div></section><div id="status" role="status" aria-live="polite"></div><div class="layout"><section class="panel library"><div class="heading"><h2>01 <span>卡片圖鑑</span></h2><label class="button subtle">＋ 自訂卡片<input id="images" type="file" accept="image/*" multiple hidden></label></div><div class="filters"><input id="search" type="search" placeholder="搜尋卡號、角色、造型…" aria-label="搜尋卡片"><select id="set" aria-label="彈數"><option value="">所有彈數</option></select><select id="rarity" aria-label="稀有度"><option value="">所有星等</option><option value="2">★★</option><option value="3">★★★</option><option value="4">★★★★</option></select><select id="filter" aria-label="清單"><option value="all">所有卡片</option><option value="have">讓 · 可讓出</option><option value="want">求 · 想徵求</option><option value="selected">已選取</option></select></div><p class="hint">點卡圖看背面 · 點「讓／求」加入清單</p><div id="cards" class="grid"></div><div id="empty" class="empty" hidden>沒有符合條件的卡片</div><button id="more" class="more">顯示更多卡片</button></section><aside class="panel maker"><h2>02 <span>交換表工作台</span></h2><label class="field">交換表標題<input id="title" value="我的卡片交換表" maxlength="40"></label><div class="pair"><label class="field">輸出內容<select id="mode"><option value="exchange">讓＋求 雙邊</option><option value="have">僅「讓」</option><option value="want">僅「求」</option></select></label><label class="field">每邊排列<select id="columns"><option value="3">一排 3 張</option><option value="5">一排 5 張</option></select></label></div><div class="preview-wrap"><canvas id="preview" aria-label="交換表預覽"></canvas></div><button id="download" class="primary full">↓ 下載 PNG 交換表</button><p class="hint">備註會出現在交換圖中。清單與備註只保存在此瀏覽器，不會上傳。</p><div class="version" id="version"></div></aside></div></main><footer>非官方收藏整理工具 · 卡片圖片與角色版權歸原權利人所有 · <a href="https://aipri.com.tw/cards/6" target="_blank" rel="noopener">官方卡片資訊 ↗</a><br>清除瀏覽器資料前，請先備份清單。</footer><script src="data/catalog.js"></script><script src="app.js"></script></body></html>
