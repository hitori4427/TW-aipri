<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片交換工作室 · 離線版</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#343047;background:#faf7fc}*{box-sizing:border-box}body{margin:0}header{padding:34px max(24px,5vw);background:#eee6f5;border-bottom:1px solid #ded1ea}small,.muted{color:#797085}h1{font-size:30px;margin:8px 0}button,.upload,select,input{font:inherit}button,.upload{cursor:pointer;border:1px solid #d8cce1;background:white;border-radius:10px;padding:10px 15px;color:#49345d}button:hover,.upload:hover{background:#eee6f5}.primary{background:#73518d;color:white;border-color:#73518d}.primary:hover{background:#5f3d77}main{max-width:1400px;margin:auto;padding:24px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}input,select{padding:10px;border:1px solid #d8cce1;border-radius:9px;background:white}#search{flex:1;min-width:180px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:24px}.panel{background:white;border:1px solid #e5ddeb;border-radius:18px;padding:20px}h2{font-size:18px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.card{border:1px solid #e7e0ec;border-radius:12px;overflow:hidden;padding:9px}.card img{width:100%;aspect-ratio:2/3;object-fit:contain;background:#f5f2f7;border-radius:6px}.card input{width:100%;margin-top:6px;font-size:12px;padding:6px}.card .actions{display:flex;gap:5px;margin-top:7px}.actions button{flex:1;padding:6px;font-size:12px}.have{background:#ffe1ec;border-color:#e9a9c2}.want{background:#e0edff;border-color:#a2bee8}#preview{width:100%;height:auto;border-radius:10px;border:1px solid #eee}#status{font-size:13px;min-height:20px;margin:10px 0;color:#73518d}.empty{text-align:center;padding:60px 15px;color:#8b7e95;line-height:1.9}.note{font-size:12px;line-height:1.8;margin-top:14px}footer{text-align:center;padding:22px;color:#91859b;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}header{padding:24px}main{padding:14px}}button:disabled{opacity:.5;cursor:wait}
</style><header><small>LOCAL CARD STUDIO / 完全離線</small><h1>卡片交換工作室</h1><div class="muted">整理你的收藏，把「讓」與「求」做成一張交換圖。</div></header><main><div class="bar"><label class="upload primary">＋ 匯入卡圖<input id="images" type="file" accept="image/*" multiple hidden></label><button id="backup">匯出完整備份</button><label class="upload">還原備份<input id="restore" type="file" accept="application/json,.json" hidden></label><span class="muted" id="count"></span></div><div id="status" role="status" aria-live="polite"></div><div class="layout"><section class="panel"><h2>01　我的卡片</h2><div class="bar"><input id="search" placeholder="搜尋編號或名稱" aria-label="搜尋卡片"><select id="filter" aria-label="顯示範圍"><option value="all">所有卡片</option><option value="have">可讓出</option><option value="want">想徵求</option></select></div><div id="cards" class="grid"></div><div id="empty" class="empty">從「匯入卡圖」開始<br>可一次選擇多張圖片，檔名會自動成為卡片編號。<br>卡片資料儲存在此瀏覽器，請定期匯出備份。</div></section><section class="panel"><h2>02　交換表預覽</h2><div class="bar"><input id="title" value="我的卡片交換表" aria-label="交換表標題" style="width:100%"><select id="mode" aria-label="輸出內容"><option value="exchange">雙邊交換表</option><option value="have">僅下載「讓」</option><option value="want">僅下載「求」</option></select><select id="columns" aria-label="每排卡片數"><option value="3">每邊一排 3 張</option><option value="5">每邊一排 5 張</option></select></div><canvas id="preview" aria-label="交換表圖片預覽"></canvas><div class="bar" style="margin-top:16px"><button id="download" class="primary">下載 PNG 交換表</button></div><div class="note muted">可同時標記「讓」與「求」。備註會出現在圖片中。<br>所有圖片在本機處理，不會上傳。此版本不內附原網站卡片圖庫，可使用你自己的卡圖。</div></section></div></main><footer>卡片交換工作室 · 無外部程式庫 · 無需網路</footer><script>
'use strict';
const $=id=>document.getElementById(id);let cards=[],db,renderVersion=0;const cache=new Map();
function status(t){$('status').textContent=t}
const ready=new Promise((resolve,reject)=>{const r=indexedDB.open('offline-card-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onerror=()=>reject(r.error);r.onsuccess=()=>{db=r.result;const q=db.transaction('data').objectStore('data').get('cards');q.onsuccess=()=>{cards=q.result||[];resolve()};q.onerror=()=>reject(q.error)}});
async function save(){await ready;return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(cards,'cards');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function persist(){try{await save();status('已儲存到此瀏覽器。')}catch(e){status('本機儲存失敗，請立即匯出備份：'+e.message)}}
function input(value,label,onchange){const e=document.createElement('input');e.value=value;e.setAttribute('aria-label',label);e.placeholder=label;e.addEventListener('change',()=>onchange(e.value));return e}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;$('cards').replaceChildren();const shown=cards.filter(c=>(c.code+' '+c.name).toLowerCase().includes(q)&&(f==='all'||c[f]));$('empty').hidden=shown.length>0;$('empty').textContent=cards.length?'沒有符合條件的卡片。':'從「匯入卡圖」開始，可一次選擇多張圖片。';$('count').textContent=`共 ${cards.length} 張 · 讓 ${cards.filter(c=>c.have).length} · 求 ${cards.filter(c=>c.want).length}`;for(const c of shown){const d=document.createElement('article');d.className='card';const img=document.createElement('img');img.src=c.image;img.alt=c.name||c.code;d.append(img);for(const [key,label] of [['code','卡片編號'],['name','卡片名稱'],['note','備註']])d.append(input(c[key],label,v=>{c[key]=v;persist();draw()}));const a=document.createElement('div');a.className='actions';for(const [key,label] of [['have','讓'],['want','求']]){const b=document.createElement('button');b.textContent=(c[key]?'✓ ':'')+label;b.className=c[key]?key:'';b.setAttribute('aria-pressed',c[key]);b.onclick=()=>{c[key]=!c[key];persist();render()};a.append(b)}const del=document.createElement('button');del.textContent='移除';del.onclick=()=>{if(confirm('移除此卡片？建議先匯出備份。')){cards=cards.filter(x=>x.uid!==c.uid);cache.delete(c.image);persist();render()}};a.append(del);d.append(a);$('cards').append(d)}draw()}
function loadImage(src){if(!cache.has(src))cache.set(src,new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('卡圖讀取失敗'));i.src=src}));return cache.get(src)}
function wrap(ctx,text,x,y,width,line,max=3){let row='',n=0;for(const ch of String(text||'')){if(ctx.measureText(row+ch).width>width&&row){ctx.fillText(row,x,y+n*line);row='';n++;if(n>=max){return}}row+=ch}if(row)ctx.fillText(row,x,y+n*line)}
async function draw(){const version=++renderVersion,mode=$('mode').value,cols=+$('columns').value,groups=mode==='exchange'?[['have','讓 · 我有的／可讓出'],['want','求 · 想徵求']]:[[mode,mode==='have'?'讓 · 我有的／可讓出':'求 · 想徵求']];const lists=groups.map(([key])=>cards.filter(c=>c[key]));const w=1200,gap=24,pad=32,panelW=(w-pad*2-gap*(groups.length-1))/groups.length,cw=(panelW-32-(cols-1)*12)/cols,ch=cw*1.5+112,rows=Math.max(1,...lists.map(l=>Math.ceil(l.length/cols))),h=Math.ceil(160+rows*ch+70);const canvas=$('preview');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#faf3f8';ctx.fillRect(0,0,w,h);ctx.textAlign='center';ctx.fillStyle='#68417c';ctx.font='bold 34px system-ui';wrap(ctx,$('title').value,w/2,62,w-100,40,1);for(let g=0;g<groups.length;g++){const x=pad+g*(panelW+gap);ctx.fillStyle='white';ctx.fillRect(x,105,panelW,h-155);ctx.fillStyle=groups[g][0]==='have'?'#b44c7a':'#487ab5';ctx.font='bold 23px system-ui';ctx.fillText(groups[g][1],x+panelW/2,145);if(!lists[g].length){ctx.font='20px system-ui';ctx.fillStyle='#998ba0';ctx.fillText('尚未選擇卡片',x+panelW/2,230)}for(let n=0;n<lists[g].length;n++){const c=lists[g][n],cx=x+16+(n%cols)*(cw+12),cy=170+Math.floor(n/cols)*ch;try{const img=await loadImage(c.image);if(version!==renderVersion)return;const scale=Math.min(cw/img.width,cw*1.5/img.height);ctx.drawImage(img,cx+(cw-img.width*scale)/2,cy+(cw*1.5-img.height*scale)/2,img.width*scale,img.height*scale)}catch(e){status(e.message)}ctx.textAlign='center';ctx.fillStyle='#403446';ctx.font='bold 16px system-ui';wrap(ctx,c.code,cx+cw/2,cy+cw*1.5+23,cw,20,1);ctx.font='14px system-ui';wrap(ctx,c.name,cx+cw/2,cy+cw*1.5+46,cw,18,2);ctx.fillStyle='#945378';wrap(ctx,c.note,cx+cw/2,cy+cw*1.5+85,cw,17,1)}}ctx.fillStyle='#9d8ba6';ctx.font='15px system-ui';ctx.fillText('卡片交換工作室',w/2,h-20);return version}
function fileData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
$('images').onchange=async e=>{await ready;status('正在匯入卡圖…');let count=0;for(const f of e.target.files){try{const raw=await fileData(f),img=await loadImage(raw),c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cards.push({uid:crypto.randomUUID(),code:f.name.replace(/\.[^.]+$/,''),name:'',note:'',have:false,want:false,image:c.toDataURL('image/png')});cache.delete(raw);count++}catch(err){status('部分圖片無法讀取：'+f.name)}}await persist();render();status(`已匯入 ${count} 張卡圖。請標記讓／求。`);e.target.value=''};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('download').onclick=async()=>{const mode=$('mode').value;if(!cards.some(c=>mode==='exchange'?(c.have||c.want):c[mode]))return status('請先標記至少一張讓／求卡片。');const btn=$('download');btn.disabled=true;try{await draw();const blob=await new Promise(r=>$('preview').toBlob(r,'image/png'));if(!blob)throw Error('圖片過大，請減少卡片數量');download(blob,($('title').value||'卡片交換表').replace(/[\\/:*?"<>|]/g,'_')+'.png');status('PNG 已產生，請查看瀏覽器下載。')}catch(e){status('下載失敗：'+e.message)}finally{btn.disabled=false}};
$('backup').onclick=()=>download(new Blob([JSON.stringify({format:'offline-card-studio',version:1,cards},null,2)],{type:'application/json'}),'卡片工作室備份.json');
$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await ready;const data=JSON.parse(await f.text());if(data.format!=='offline-card-studio'||!Array.isArray(data.cards)||!data.cards.every(c=>typeof c.code==='string'&&typeof c.name==='string'&&typeof c.note==='string'&&typeof c.image==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(c.image)))throw Error('備份格式不正確');cards.push(...data.cards.map(c=>({uid:crypto.randomUUID(),code:c.code,name:c.name,note:c.note,image:c.image,have:!!c.have,want:!!c.want})));await persist();render();status('備份已合併匯入。')}catch(err){status('還原失敗：'+err.message)}e.target.value=''};
for(const id of ['search','filter'])$(id).addEventListener('input',render);for(const id of ['title','mode','columns'])$(id).addEventListener('input',draw);ready.then(render).catch(e=>{status('瀏覽器本機儲存無法開啟：'+e.message);render()});
</script></html>
